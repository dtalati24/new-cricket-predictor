[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-cricket-predictor"
version = "0.1.0"
description = "Monte Carlo simulator for T20 first-innings scores, for pricing Betfair first-innings over/under lines"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
model = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=15.0", "scipy>=1.11", "scikit-learn>=1.4", "pyreadr>=0.5"]
gbm = ["lightgbm>=4.0", "xgboost>=2.0", "scikit-learn>=1.4"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ["."] and NOT ["src"]: with src/ on sys.path a bare `from config import ...` (the
# archive's import style) silently loads a second copy of the module instead of
# raising ImportError, so a missed import repoint in a port would fail silently.
pythonpath = ["."]
addopts = "-q"
