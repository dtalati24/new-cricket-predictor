name: walk-forward

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Test years, comma-separated"
        default: "2023,2024,2025,2026"
        required: true
      n_sims_test:
        description: "Simulations per test match"
        default: "10000"
        required: true
      feature_sets:
        description: "Feature sets, comma-separated: full, base (A/B comparison)"
        default: "full"
        required: true
      models:
        description: "Models to fit and score, comma-separated"
        default: "logistic,lightgbm,xgboost"
        required: true
      data_tag:
        description: "Release tag holding data_bundle.tar.gz"
        default: "data-v1"
        required: true

permissions:
  contents: read

jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.y.outputs.list }}
      sets: ${{ steps.y.outputs.sets }}
    steps:
      - id: y
        run: |
          echo "list=[${{ inputs.years }}]" >> "$GITHUB_OUTPUT"
          echo "sets=[\"$(echo '${{ inputs.feature_sets }}' | sed 's/ //g; s/,/","/g')\"]" >> "$GITHUB_OUTPUT"

  fold:
    needs: years
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.years.outputs.list) }}
        feature_set: ${{ fromJSON(needs.years.outputs.sets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data bundle (private release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.data_tag }}" --pattern data_bundle.tar.gz
          tar -xzf data_bundle.tar.gz
      - name: Run fold
        timeout-minutes: 340
        run: python -u -m src.walkforward --year ${{ matrix.year }} --workers 2 --n-sims-test ${{ inputs.n_sims_test }} --models ${{ inputs.models }} --feature-set ${{ matrix.feature_set }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkforward-${{ matrix.year }}-${{ matrix.feature_set }}
          path: data/reports/walkforward/

  summary:
    needs: fold
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: walkforward-*
          merge-multiple: true
          path: data/reports/walkforward/
      - run: |
          if ls data/reports/walkforward/*.json >/dev/null 2>&1; then python -m src.walkforward --summary; fi
          if [ -d data/reports/walkforward/base ]; then python -m src.walkforward --summary --feature-set base; fi
      - uses: actions/upload-artifact@v4
        with:
          name: walkforward-summary
          path: |
            data/reports/walkforward/summary.json
            data/reports/walkforward/base/summary.json
          if-no-files-found: warn
